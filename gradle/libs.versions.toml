junit = "4.13.2"
kotlin = "2.3.0"
ktor = "3.3.3"
logback = "1.5.24"
material3 = "1.10.0-alpha05"
material = "1.13.0"
kotlinStdlib = "2.3.0"

# KotlinX
kotlinx-coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.10.0"

# AndroidX
androidx-activity = "1.12.2"
